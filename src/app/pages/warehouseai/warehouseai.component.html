<div class="layout">

    <app-sidebar></app-sidebar>

    <div class="right-section">

        <app-header></app-header>
        

        <router-outlet></router-outlet>

    </div>

</div>

<div class="expense-review-page">
  <!-- ==================== AI CHATBOT ==================== -->
  <!-- Chat FAB (Floating Action Button) -->
  <div class="chatbot-fab" (click)="toggleChat()" *ngIf="!isChatOpen">
    <i class="pi pi-comments"></i>
  </div>

  <!-- Chat Window -->
  <div class="chatbot-window" [class.open]="isChatOpen">
    <div class="chatbot-header">
      <div class="header-left">
        <div class="bot-avatar"><i class="pi pi-sparkles"></i></div>
        <div class="bot-info">
          <h4>DIZI AI</h4>
          <span>Online</span>
        </div>
      </div>
      <button class="close-chat-btn" (click)="toggleChat()">
        <i class="pi pi-times"></i>
      </button>
    </div>

    <div class="chatbot-messages" #chatScroll>
      <div *ngFor="let msg of chatMessages" 
           class="chat-bubble" 
           [ngClass]="msg.role === 'user' ? 'user-message' : 'bot-message'">
        <div class="bubble-content">{{ msg.content }}</div>

        <!-- Data table toggle — shown only for LLM2 results that have rows -->
        <div class="table-actions" *ngIf="msg.role === 'ai' && msg.rows && msg.rows.length > 0">
          <button class="toggle-table-btn" (click)="toggleTable(msg)">
            <i class="pi" [ngClass]="msg.showTable ? 'pi-chevron-up' : 'pi-table'"></i>
            {{ msg.showTable ? 'Hide Data' : 'View Data (' + msg.rows.length + ' records)' }}
          </button>
          <div class="data-table-wrapper" *ngIf="msg.showTable">
            <div class="data-table-scroll">
              <table class="data-table">
                <thead>
                  <tr>
                    <th *ngFor="let key of getTableKeys(msg.rows!)">{{ key }}</th>
                  </tr>
                </thead>
                <tbody>
                  <tr *ngFor="let row of msg.rows!">
                    <td *ngFor="let key of getTableKeys(msg.rows!)">{{ row[key] ?? '—' }}</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>

      </div>
      
      <div class="typing-indicator" *ngIf="isTyping">
        <span></span><span></span><span></span>
      </div>
    </div>

    <div class="chatbot-input">
      <input type="text" 
             placeholder="Ask DIZI AI anything..." 
             [(ngModel)]="currentMessage" 
             (keyup.enter)="sendMessage()" />
      <button class="send-btn" (click)="sendMessage()" [disabled]="!currentMessage.trim()">
        <i class="pi pi-send"></i>
      </button>
    </div>
  </div>
</div>
