<div class="expense-review-page">
  <!-- ==================== AI CHATBOT ==================== -->
  <!-- Chat FAB (Floating Action Button) -->
  <div class="chatbot-fab" (click)="toggleChat()" *ngIf="!isChatOpen">
    <i class="pi pi-comments"></i>
  </div>

  <!-- Chat Window -->
  <div class="chatbot-window" [class.open]="isChatOpen">
    <div class="chatbot-header">
      <div class="header-left">
        <div class="bot-avatar"><i class="pi pi-sparkles"></i></div>
        <div class="bot-info">
          <h4>DIZI AI</h4>
          <span>Online</span>
        </div>
      </div>
      <button class="close-chat-btn" (click)="toggleChat()">
        <i class="pi pi-times"></i>
      </button>
    </div>

    <div class="chatbot-messages" #chatScroll>
      <div *ngFor="let msg of chatMessages" 
           class="chat-bubble" 
           [ngClass]="msg.role === 'user' ? 'user-message' : 'bot-message'">
        <div class="bubble-content">{{ msg.content }}</div>
      </div>
      
      <div class="typing-indicator" *ngIf="isTyping">
        <span></span><span></span><span></span>
      </div>
    </div>

    <div class="chatbot-input">
      <input type="text" 
             placeholder="Ask DIZI AI anything..." 
             [(ngModel)]="currentMessage" 
             (keyup.enter)="sendMessage()" />
      <button class="send-btn" (click)="sendMessage()" [disabled]="!currentMessage.trim()">
        <i class="pi pi-send"></i>
      </button>
    </div>
  </div>
</div>
